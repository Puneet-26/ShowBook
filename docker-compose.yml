version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: showbook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: showbook
    ports:
      - "5432:5432"
    volumes:
      - showbook-pgdata:/var/lib/postgresql/data

volumes:
  showbook-pgdata:
